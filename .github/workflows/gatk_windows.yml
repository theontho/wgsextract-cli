name: GATK native Windows smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gatk-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          locked: true
          environments: >-
            default
            dev
            gatk
      - name: Installed-package native HaplotypeCaller and Linux body parity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/gatk-smoke/process-tmp | Out-Null
          $env:TEMP = (Resolve-Path out/gatk-smoke/process-tmp).Path
          $env:TMP = $env:TEMP
          pixi run pytest -q tests/test_gkl_windows.py --basetemp out/gatk-smoke/pytest `
            -o tmp_path_retention_policy=all -rA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Installed sidecar native likelihood and Smith-Waterman parity
        shell: pwsh
        run: |
          $info = pixi info --json | ConvertFrom-Json
          $prefix = ($info.environments_info | Where-Object name -eq gatk).prefix
          $gatk = Get-ChildItem "$prefix/share/gatk4-*/gatk-package-4.6.2.0-local.jar" | Select-Object -First 1
          if (!$gatk) { throw "Missing pinned GATK jar" }
          $sidecar = "$prefix/Library/share/gkl/gkl-native-wgse.jar"
          New-Item -ItemType Directory -Force out/gatk-smoke/classes | Out-Null
          $tmp = (Resolve-Path out/gatk-smoke/process-tmp).Path
          $env:TEMP = $tmp
          $env:TMP = $tmp
          pixi run -e gatk javac -cp $gatk.FullName -d out/gatk-smoke/classes `
            packaging/windows/recipes/gkl/tests/GklParityProbe.java
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pixi run -e gatk java -Xmx512m "-Djava.io.tmpdir=$tmp" `
            -cp "out/gatk-smoke/classes;$sidecar;$($gatk.FullName)" `
            GklParityProbe out/gatk-smoke/native-jni.tsv $tmp 2>&1 |
            Tee-Object out/gatk-smoke/native-jni.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pixi run python packaging/windows/recipes/gkl/tests/compare_jni.py `
            --candidate out/gatk-smoke/native-jni.tsv --out out/gatk-smoke/native-jni-parity.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gatk-native-windows-smoke
          path: out/gatk-smoke/
          if-no-files-found: warn
