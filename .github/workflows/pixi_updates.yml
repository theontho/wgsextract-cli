name: Weekly Pixi refresh

# The refresh job resolves and validates a lockfile candidate with a read-only
# token. Only after it passes does the pull-request job, the sole job with write
# permissions, force-update one fixed branch and open or update one PR.
#
# Pushes and PRs made with GITHUB_TOKEN do not start push/pull_request
# workflows, so the PR job dispatches the CI workflows on the refresh branch.
# workflow_dispatch is the one event GITHUB_TOKEN may start; the dispatched runs
# check out the branch head, so their check runs attach to the PR's head SHA.

on:
  schedule:
    - cron: "43 6 * * 2"
  workflow_dispatch:
    inputs:
      pr_from_this_ref:
        description: >-
          Testing only: open the refresh PR even when dispatched from a
          non-default branch (the PR then also contains that branch's commits)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pixi-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          locked: true
          environments: dev
      - name: Refresh within the declared pins
        id: refresh
        run: |
          mkdir -p out/pixi-update
          pixi update --concurrent-solves 2 --concurrent-downloads 8
          # Use the installed interpreter; repair digests before candidate installation.
          pixi run --frozen --no-install -e dev -x python scripts/restore_pixi_hashes.py
          git diff --exit-code -- pixi.toml pyproject.toml
          git diff --binary -- pixi.lock > out/pixi-update/pixi-lock.patch
          git diff --stat -- pixi.lock | tee out/pixi-update/summary.txt
          if [ -s out/pixi-update/pixi-lock.patch ]; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi
      - name: Validate the candidate resolution
        id: validate
        if: steps.refresh.outputs.changed == 'true'
        run: |
          pixi run lint
          pixi run typecheck
          pixi run test
      - name: Publish candidate for a reviewed dependency PR
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixi-update-candidate
          path: out/pixi-update
      - name: Summarise the candidate
        if: always()
        env:
          CHANGED: ${{ steps.refresh.outputs.changed }}
          VALIDATION: ${{ steps.validate.outcome }}
        run: |
          {
            echo '## Pixi update candidate'
            echo "Lockfile changed: ${CHANGED:-unknown}. Candidate validation: ${VALIDATION}."
            echo 'Only a validated change is pushed to the refresh PR; nothing is merged automatically.'
            echo 'Review numerical-tool changes against public small/full-genome byte-parity gates before merging.'
          } >> "$GITHUB_STEP_SUMMARY"

  pull-request:
    needs: refresh
    # Scheduled runs use the default branch. A dispatch from another branch only
    # opens a PR when explicitly asked to, so a stray dispatch cannot replace the
    # refresh PR with an unrelated branch's commits.
    if: >-
      needs.refresh.result == 'success' &&
      (github.ref_name == github.event.repository.default_branch ||
       inputs.pr_from_this_ref)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # force-push the fixed refresh branch
      pull-requests: write # open, update or close the refresh PR
      actions: write # dispatch CI on the refresh branch (see the header)
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: automation/pixi-refresh
      BASE: ${{ github.event.repository.default_branch }}
      CHANGED: ${{ needs.refresh.outputs.changed }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Workflows whose pull_request triggers cover a pixi.lock-only change.
      # CodeQL is omitted: it has no workflow_dispatch and scans no lockfile.
      CI_WORKFLOWS: >-
        ubuntu_ci.yml macos_ci.yml windows_ci.yml linux_arm64.yml
        gatk_windows.yml gkl_windows.yml dev_setup.yml gitleaks.yml
        install_lab.yml
    steps:
      - name: Close a refresh PR that no change supersedes
        if: needs.refresh.outputs.changed != 'true'
        run: |
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$BASE" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr close "$pr" -R "$GITHUB_REPOSITORY" --delete-branch \
              --comment "The weekly refresh found no lockfile change against $BASE ($RUN_URL)."
          fi
          echo "No lockfile change; no refresh PR is needed." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.refresh.outputs.changed == 'true'
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.refresh.outputs.changed == 'true'
        with:
          name: pixi-update-candidate
          path: ${{ runner.temp }}/pixi-update
      - name: Commit and force-update the refresh branch
        id: push
        if: needs.refresh.outputs.changed == 'true'
        env:
          PATCH_DIR: ${{ runner.temp }}/pixi-update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git apply --index "$PATCH_DIR/pixi-lock.patch"
          git commit --quiet -m 'chore(deps): refresh pixi.lock within the declared pins' \
            -m "Resolved and validated by $RUN_URL"
          # An identical tree is already on the branch, with CI already run.
          if git fetch --quiet origin "refs/heads/$BRANCH" 2>/dev/null &&
             git diff --quiet FETCH_HEAD HEAD; then
            echo pushed=false >> "$GITHUB_OUTPUT"
          else
            git push --force origin "HEAD:refs/heads/$BRANCH"
            echo pushed=true >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update the refresh PR
        if: needs.refresh.outputs.changed == 'true'
        env:
          PATCH_DIR: ${{ runner.temp }}/pixi-update
        run: |
          body="$RUNNER_TEMP/pr-body.md"
          {
            cat <<'NOTE'
          Weekly `pixi update` within the declared `pixi.toml` pins, with declared
          direct-archive digests restored.

          NOTE
            echo "Lint, typecheck and tests passed on the candidate in $RUN_URL."
            cat <<'NOTE'
          CI on this branch is started by `workflow_dispatch`, because PRs opened with
          `GITHUB_TOKEN` start no `pull_request` workflows.

          Review numerical-tool changes against the public small/full-genome byte-parity
          gates before merging.

          ```
          NOTE
            cat "$PATCH_DIR/summary.txt"
            echo '```'
          } > "$body"
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$BASE" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" -R "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh pr create -R "$GITHUB_REPOSITORY" --base "$BASE" --head "$BRANCH" \
              --title 'chore(deps): weekly Pixi lockfile refresh' \
              --body-file "$body" --label dependencies
          fi
      - name: Dispatch CI on the refresh branch
        if: steps.push.outputs.pushed == 'true'
        run: |
          sha=$(git rev-parse HEAD)
          echo "## CI dispatched on \`$BRANCH\` at \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          for workflow in $CI_WORKFLOWS; do
            gh workflow run "$workflow" -R "$GITHUB_REPOSITORY" --ref "$BRANCH"
            echo "- $workflow" >> "$GITHUB_STEP_SUMMARY"
          done
