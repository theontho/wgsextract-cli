name: Weekly Pixi refresh

# The refresh job resolves and validates a lockfile candidate with a read-only
# token. Only after it passes does the pull-request job, the sole job with write
# permissions, force-update one fixed branch and open or update one PR.
#
# CI on the refresh PR: GitHub records the pull_request runs of a PR opened or
# pushed with GITHUB_TOKEN as "action_required" instead of running them. A
# maintainer approves them (the PR body gives the command), and they then run as
# ordinary pull_request checks on the PR head. Dispatching CI with
# workflow_dispatch is not an alternative: its checks attach to the head SHA but
# GitHub neither shows them on the PR nor counts them for required checks
# (docs.github.com, "Troubleshooting required status checks").

on:
  schedule:
    - cron: "43 6 * * 2"
  workflow_dispatch:
    inputs:
      pr_from_this_ref:
        description: >-
          Testing only: open the refresh PR even when dispatched from a
          non-default branch (the PR then also contains that branch's commits)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pixi-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
      patch_sha256: ${{ steps.refresh.outputs.patch_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.82.0
          locked: true
          environments: dev
      - name: Refresh within the declared pins
        id: refresh
        run: |
          mkdir -p out/pixi-update
          pixi update --concurrent-solves 2 --concurrent-downloads 8
          # Use the installed interpreter; repair digests before candidate installation.
          pixi run --frozen --no-install -e dev -x python scripts/restore_pixi_hashes.py
          git diff --exit-code -- pixi.toml pyproject.toml
          # Pixi re-derives each PyPI purl's ?source= mapping tag from run to
          # run; a lock differing only in those tags is no update.
          norm() { sed -E 's/\?source=[a-z-]+$//'; }
          if cmp -s <(git show HEAD:pixi.lock | norm) <(norm < pixi.lock); then
            git checkout -- pixi.lock
          fi
          git diff --binary -- pixi.lock > out/pixi-update/pixi-lock.patch
          git diff --stat -- pixi.lock | tee out/pixi-update/summary.txt
          # Fixed before any candidate code runs; the write job checks it.
          sha=$(sha256sum out/pixi-update/pixi-lock.patch | cut -d' ' -f1)
          echo "patch_sha256=$sha" >> "$GITHUB_OUTPUT"
          if [ -s out/pixi-update/pixi-lock.patch ]; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi
      # Upload before validation installs and runs the candidate's packages.
      - name: Publish candidate for a reviewed dependency PR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixi-update-candidate
          path: out/pixi-update
      - name: Validate the candidate resolution
        id: validate
        if: steps.refresh.outputs.changed == 'true'
        # Same parallel, grouped test command as the CI merge gate; a serial
        # `pixi run test` hits order-dependent failures unrelated to the lock.
        run: |
          pixi run lint
          pixi run typecheck
          pixi run test-ci
      - name: Summarise the candidate
        if: always()
        env:
          CHANGED: ${{ steps.refresh.outputs.changed }}
          VALIDATION: ${{ steps.validate.outcome }}
        run: |
          {
            echo '## Pixi update candidate'
            echo "Lockfile changed: ${CHANGED:-unknown}. Candidate validation: ${VALIDATION}."
            echo 'Only a validated change is pushed to the refresh PR; nothing is merged automatically.'
            echo 'Review numerical-tool changes against public small/full-genome byte-parity gates before merging.'
          } >> "$GITHUB_STEP_SUMMARY"

  pull-request:
    needs: refresh
    # Scheduled runs use the default branch. A dispatch from another branch only
    # opens a PR when explicitly asked to, so a stray dispatch cannot replace the
    # refresh PR with an unrelated branch's commits.
    if: >-
      needs.refresh.result == 'success' &&
      (github.ref_name == github.event.repository.default_branch ||
       inputs.pr_from_this_ref)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # force-push the fixed refresh branch
      pull-requests: write # open, update or close the refresh PR
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: automation/pixi-refresh
      BASE: ${{ github.event.repository.default_branch }}
      CHANGED: ${{ needs.refresh.outputs.changed }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Close a refresh PR that no change supersedes
        if: needs.refresh.outputs.changed != 'true'
        run: |
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$BASE" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr close "$pr" -R "$GITHUB_REPOSITORY" --delete-branch \
              --comment "The weekly refresh found no lockfile change against $BASE ($RUN_URL)."
          fi
          echo "No lockfile change; no refresh PR is needed." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.refresh.outputs.changed == 'true'
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.refresh.outputs.changed == 'true'
        with:
          name: pixi-update-candidate
          path: ${{ runner.temp }}/pixi-update
      - name: Commit and force-update the refresh branch
        id: push
        if: needs.refresh.outputs.changed == 'true'
        env:
          PATCH: ${{ runner.temp }}/pixi-update/pixi-lock.patch
          PATCH_SHA256: ${{ needs.refresh.outputs.patch_sha256 }}
        run: |
          # The artifact must be the patch made before candidate code ran, and
          # may change pixi.lock only.
          echo "$PATCH_SHA256  $PATCH" | sha256sum --check --strict -
          touched=$(git apply --numstat "$PATCH" | cut -f3 | sort -u)
          if [ "$touched" != pixi.lock ]; then
            echo "::error::Refresh patch touches more than pixi.lock: $touched"
            exit 1
          fi
          git apply --index --include=pixi.lock "$PATCH"
          staged=$(git diff --cached --name-only)
          if [ "$staged" != pixi.lock ]; then
            echo "::error::Staged files are not exactly pixi.lock: $staged"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m 'chore(deps): refresh pixi.lock within the declared pins' \
            -m "Resolved and validated by $RUN_URL"
          # The branch already holds this content (ignoring the purl ?source=
          # tags, as above); keep its head and its CI approval.
          norm() { sed -E 's/\?source=[a-z-]+$//'; }
          if git fetch --quiet origin "refs/heads/$BRANCH" 2>/dev/null &&
             git diff --quiet FETCH_HEAD HEAD -- . ':(exclude)pixi.lock' &&
             cmp -s <(git show FETCH_HEAD:pixi.lock | norm) <(git show HEAD:pixi.lock | norm); then
            echo "head=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          else
            git push --force origin "HEAD:refs/heads/$BRANCH"
            echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update the refresh PR
        if: needs.refresh.outputs.changed == 'true'
        env:
          HEAD_SHA: ${{ steps.push.outputs.head }}
        run: |
          body="$RUNNER_TEMP/pr-body.md"
          {
            cat <<'NOTE'
          Weekly `pixi update` within the declared `pixi.toml` pins, with declared
          direct-archive digests restored.

          NOTE
            echo "Lint, typecheck and tests passed on the candidate in $RUN_URL."
            cat <<'NOTE'

          GitHub holds CI for PRs pushed with `GITHUB_TOKEN` until a maintainer approves
          it. Approve with "Approve workflows to run" on this PR, or:

          ```sh
          NOTE
            echo "gh run list -R $GITHUB_REPOSITORY --commit $HEAD_SHA --status action_required \\"
            echo "  --json databaseId --jq '.[].databaseId' |"
            echo "  xargs -I{} gh api -X POST repos/$GITHUB_REPOSITORY/actions/runs/{}/approve"
            cat <<'NOTE'
          ```

          Review numerical-tool changes against the public small/full-genome byte-parity
          gates before merging.

          ```
          NOTE
            git diff --stat HEAD~1 HEAD
            echo '```'
          } > "$body"
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$BASE" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" -R "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh pr create -R "$GITHUB_REPOSITORY" --base "$BASE" --head "$BRANCH" \
              --title 'chore(deps): weekly Pixi lockfile refresh' \
              --body-file "$body" --label dependencies
          fi
