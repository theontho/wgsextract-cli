name: Aligner bench probe (temporary)
on:
  push:
    branches: [ issue-364-ci-bench ]
    paths: [ .github/workflows/aligner_bench_probe.yml ]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ macos-15, macos-26, macos-latest, macos-15-intel ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hardware
        run: |
          set -x
          uname -a; sw_vers
          sysctl hw.memsize hw.ncpu hw.model machdep.cpu.brand_string hw.perflevel0.logicalcpu hw.perflevel1.logicalcpu vm.swapusage vm.user_wire_limit vm.global_user_wire_limit kern.memorystatus.wired_max_proc_pct kern.memorystatus_level || true
          df -h / /System/Volumes/Data "$RUNNER_TEMP" "$GITHUB_WORKSPACE" || true
          memory_pressure | tail -5 || true
          vm_stat
          pmset -g therm || true; pmset -g ps || true
          ulimit -a
          which zstd gzip xz openssl shasum curl gh swiftc cmake || true
          system_profiler SPDisplaysDataType SPHardwareDataType 2>/dev/null | head -40
          swiftc -O -o metal_info native/bench/metal_info.swift && ./metal_info || true
          ls /Volumes; diskutil list | head -40
      - name: Balloon
        if: runner.arch == 'ARM64'
        run: |
          cc -O2 -o balloon native/bench/balloon.c
          w() { vm_stat | awk '/wired down/ {printf "wired=%.2fGiB\n", $4*16384/2^30}'; sysctl -n vm.swapusage; memory_pressure | tail -1; }
          w
          ./balloon 1500 & p1=$!; sleep 3; w
          ./balloon 2500 & p2=$!; sleep 3; w; ps -o pid,rss,stat,command -p $p1,$p2 || true
          ./balloon 1500 & p3=$!; sleep 3; w; ps -o pid,rss,stat,command -p $p1,$p2,$p3 || true
          kill $p1 $p2 $p3 || true; wait || true
          w
      - name: Download speed
        run: |
          time curl -sSL -o big.bin https://github.com/WGSExtract/wgsextract-cli/releases/download/macos-aligners-9/wgse-bwa-0.7.0-macos-arm64.tar.gz
          ls -l big.bin
