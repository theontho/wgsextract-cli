name: Release

# A release starts in either of two ways:
# - Merging a release PR into main. When the version in pyproject.toml
#   changes, this workflow creates the vX.Y.Z tag itself, so nobody needs to
#   push a tag (agent sessions often can't).
# - Pushing a vX.Y.Z tag by hand, or running this workflow on main (which
#   retries a release whose checks failed).
# Either way the tag must match the version in pyproject.toml, pixi.toml and
# the package, and the checks must pass. If the release PR added
# docs/release-notes/vX.Y.Z.md, the release is published as the latest with
# those notes (install.sh installs the latest published release); otherwise
# it's left as a draft with generated notes to edit and publish.

on:
  push:
    branches: [ main ]
    paths: [ "pyproject.toml" ]
    tags: [ "v*" ]
  # Retries a release from main after a fix, e.g. if its checks failed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      create_tag: ${{ steps.tag.outputs.create_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Work out the tag to release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$REF_NAME" != main ]; then
            echo "::error::Releases come from main, not $REF_NAME."
            exit 1
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="v$version"
          # pyproject.toml changes for other reasons too; only a new version
          # is a release.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "$tag already exists; nothing to release."
            exit 0
          fi
          echo "Releasing $tag from $GITHUB_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "create_tag=true" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the package version
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          python3 - "$TAG" <<'EOF'
          import re, sys, tomllib
          tag = sys.argv[1]
          with open("pyproject.toml", "rb") as f:
              pyproject = tomllib.load(f)["project"]["version"]
          with open("pixi.toml", "rb") as f:
              pixi = tomllib.load(f)["workspace"]["version"]
          with open("src/wgsextract_cli/__init__.py") as f:
              package = re.search(r'__version__ = "([^"]+)"', f.read())[1]
          versions = {"pyproject.toml": pyproject, "pixi.toml": pixi,
                      "src/wgsextract_cli/__init__.py": package}
          wrong = {path: v for path, v in versions.items() if f"v{v}" != tag}
          if wrong:
              sys.exit(f"Tag {tag} doesn't match: {wrong}")
          print(f"{tag} matches {', '.join(versions)}")
          EOF
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          locked: true
          environments: >-
            default
            dev
      - name: Lint and type check
        run: |
          pixi run lint
          pixi run typecheck
      - name: Tests
        run: pixi run test
      - name: Build and smoke test the package
        run: pixi run package-smoke

  release:
    needs: [ resolve, verify ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the tag
        if: needs.resolve.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        # A tag created with the workflow token doesn't start another run.
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/git/refs"
          -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          notes="docs/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "wgsextract-cli $TAG" --notes-file "$notes" --latest
          else
            echo "::notice::No $notes, so $TAG is a draft with generated notes; edit and publish it."
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --draft --generate-notes --title "wgsextract-cli $TAG"
          fi
