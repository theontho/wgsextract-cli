name: Windows HTS profiling builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        recipe: [bcftools, samtools]
        compiler: [gcc-stop-simd-inline-lto]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
      - name: Install build packages
        shell: msys2 {0}
        run: |
          mkdir -p out
          grep -v '^#' packaging/windows/msys2-packages.txt | xargs pacman -S --needed --noconfirm --noprogressbar
          if [ '${{ matrix.compiler }}' = clang ]; then
            pacman -S --needed --noconfirm --noprogressbar mingw-w64-ucrt-x86_64-clang
          fi
          pacman -Q > out/msys2-packages-used.txt
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          run-install: false
      - name: Build native tools with function symbols
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $envScript = 'packaging/windows/recipes/env.sh'
          $content = [IO.File]::ReadAllText($envScript).Replace('STATIC_LDFLAGS="-static -s"', 'STATIC_LDFLAGS="-static"')
          if ('${{ matrix.compiler }}'.EndsWith('lto')) {
              $content = $content.Replace('OPT="-O3 -march=x86-64-v2 -mtune=generic"', 'OPT="-O3 -march=x86-64-v2 -mtune=generic -flto"')
              $content = $content.Replace('make -j"$JOBS" lib-static', 'make -j"$JOBS" AR=gcc-ar lib-static')
              $recipeScript = 'packaging/windows/recipes/${{ matrix.recipe }}/build.sh'
              $script = [IO.File]::ReadAllText($recipeScript).Replace('make -j"$JOBS"', 'make -j"$JOBS" AR=gcc-ar')
              [IO.File]::WriteAllText($recipeScript, $script, [Text.UTF8Encoding]::new($false))
          }
          if ('${{ matrix.compiler }}'.Contains('inline')) {
              $content = $content.Replace('-mtune=generic -flto', '-mtune=generic -flto -minline-stringops-dynamically')
          }
          if ('${{ matrix.compiler }}' -eq 'clang') {
              $content = $content.Replace('./configure --disable', './configure CC=clang --disable')
              $recipeScript = 'packaging/windows/recipes/${{ matrix.recipe }}/build.sh'
              $script = [IO.File]::ReadAllText($recipeScript).Replace('./configure --with', './configure CC=clang --with')
              [IO.File]::WriteAllText($recipeScript, $script, [Text.UTF8Encoding]::new($false))
          }
          [IO.File]::WriteAllText($envScript, $content, [Text.UTF8Encoding]::new($false))
          pixi exec --spec rattler-build==0.77.0 rattler-build build --recipe-dir packaging/windows/recipes/${{ matrix.recipe }} --output-dir out/conda --target-platform win-64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-hts-${{ matrix.recipe }}-${{ matrix.compiler }}
          path: |
            out/conda/win-64/*.conda
            out/msys2-packages-used.txt
          if-no-files-found: error
