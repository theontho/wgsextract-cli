name: Windows BWA performance probes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant: [clang-prefetch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
      - name: Install build packages
        shell: msys2 {0}
        run: |
          mkdir -p out
          grep -v '^#' packaging/windows/msys2-packages.txt | xargs pacman -S --needed --noconfirm --noprogressbar
          if [[ '${{ matrix.variant }}' == clang* ]]; then
            pacman -S --needed --noconfirm --noprogressbar mingw-w64-ucrt-x86_64-clang
          fi
          pacman -Q > out/msys2-packages-used.txt
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          run-install: false
      - name: Select compiler variant and build BWA
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $variant = '${{ matrix.variant }}'
          $flags = switch ($variant) {
              'baseline' { '' }
              'o2' { '-O2' }
              'lto' { '-flto' }
              'native-stdio' { '-D__USE_MINGW_ANSI_STDIO=0' }
              'native-stdio-lto' { '-D__USE_MINGW_ANSI_STDIO=0 -flto' }
              'prefetch-lto' { '-flto' }
              'prefetch' { '' }
              'clang' { '' }
              'clang-prefetch' { '' }
          }
          $recipe = 'packaging/windows/recipes/bwa/build.sh'
          $script = [IO.File]::ReadAllText($recipe)
          if ($flags) { $script = $script.Replace('CFLAGS="$OPT ', 'CFLAGS="$OPT ' + $flags + ' ') }
          $script = $script.Replace('CC=gcc', 'CC=gcc AR=gcc-ar')
          if ($variant -like 'clang*') { $script = $script.Replace('CC=gcc AR=gcc-ar', 'CC=clang AR=gcc-ar') }
          if ($variant -match 'prefetch') {
              $metadata = 'packaging/windows/recipes/bwa/recipe.yaml'
              $source = [IO.File]::ReadAllText($metadata).Replace('    - patches/0001-windows-native-build.patch', '    - patches/0001-windows-native-build.patch' + "`n    - prefetch.patch")
              [IO.File]::WriteAllText($metadata, $source, [Text.UTF8Encoding]::new($false))
          }
          [IO.File]::WriteAllText($recipe, $script, [Text.UTF8Encoding]::new($false))
          # Retain function symbols in these diagnostic artifacts for profiling.
          $envScript = 'packaging/windows/recipes/env.sh'
          $content = [IO.File]::ReadAllText($envScript).Replace('STATIC_LDFLAGS="-static -s"', 'STATIC_LDFLAGS="-static"')
          [IO.File]::WriteAllText($envScript, $content, [Text.UTF8Encoding]::new($false))
          pixi exec --spec rattler-build==0.77.0 rattler-build build --recipe-dir packaging/windows/recipes/bwa --output-dir out/conda --target-platform win-64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-bwa-${{ matrix.variant }}
          path: |
            out/conda/win-64/*.conda
            out/msys2-packages-used.txt
          if-no-files-found: error
