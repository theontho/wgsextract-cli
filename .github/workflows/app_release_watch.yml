name: App release watch

# A new WGS Extract app release gets the full Install Lab run (the weekly matrix:
# pinned CLI and negative controls included) within the hour, not at the next
# weekly run. gui-for-cli can't dispatch workflows here without a credential, so
# this repo checks for new releases itself.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the Install Lab if the app released since its last full run
        env:
          GH_TOKEN: ${{ github.token }}
          GUI_REPO: theontho/gui-for-cli
        run: |
          read -r tag published < <(gh release view -R "$GUI_REPO" --json tagName,publishedAt -q '"\(.tagName) \(.publishedAt)"')
          # Full runs on main: the weekly schedule, or a dispatch like this one.
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w install_lab.yml -b main -L 100 \
            --json event,createdAt -q '[.[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].createdAt // ""')
          echo "App $tag published $published; last full Install Lab run on main: ${last:-none}"
          # Both are UTC ISO 8601 timestamps, so they compare as strings.
          if [[ -n "$last" && ! "$published" > "$last" ]]; then
            exit 0
          fi
          gh workflow run install_lab.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "Started the Install Lab for app $tag." >> "$GITHUB_STEP_SUMMARY"
