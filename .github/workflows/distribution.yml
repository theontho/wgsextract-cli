name: Distribution

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tauri:
    name: Tauri (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            artifact_name: tauri-linux
          - os: macos
            runner: macos-latest
            artifact_name: tauri-macos-arm64
          - os: macos
            runner: macos-15-intel
            artifact_name: tauri-macos-x64
          - os: windows
            runner: windows-latest
            artifact_name: tauri-windows
    env:
      PYTHON: python3
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY || secrets.TAURI_UPDATER_PUBKEY }}
      TAURI_UPDATER_ENDPOINTS: ${{ vars.TAURI_UPDATER_ENDPOINTS }}
      TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      PACKAGE_REQUIRE_MACOS_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "PACKAGE_APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            zstd

      # Tauri signs and notarizes the macOS app when these variables are set:
      # https://v2.tauri.app/distribute/sign/macos/
      - name: Configure macOS signing and notarization
        if: matrix.os == 'macos'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            if [ -n "$PACKAGE_REQUIRE_MACOS_SIGNING" ]; then
              echo "::error::Tagged releases need APPLE_CERTIFICATE_P12 and APPLE_SIGNING_IDENTITY secrets."
              exit 1
            fi
            echo "::warning::Apple signing secrets are not configured; the macOS app will be unsigned."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_P12"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          # Preferred: an App Store Connect API key (no Apple ID password or 2FA).
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER_ID" ]; then
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            {
              echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_ID"
              echo "APPLE_API_KEY_PATH=$key"
            } >> "$GITHUB_ENV"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          elif [ -n "$PACKAGE_REQUIRE_MACOS_SIGNING" ]; then
            echo "::error::Tagged releases need notarization credentials (App Store Connect API key or Apple ID)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --prefix app

      - name: Package Tauri app
        run: python3 tools/tasks.py package tauri

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: out/release/tauri/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - tauri
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts

      - name: Generate updater feeds
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 tools/packaging/generate_update_feeds.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --version "$version" \
            --artifacts-root release-artifacts \
            --output-dir release-artifacts/update-feeds

      - name: Stage release assets
        run: |
          rm -rf release-assets
          mkdir -p release-assets
          find release-artifacts -type f -print0 | while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            case "$name" in
              latest.json|*.sig|*.app.tar.gz|*.dmg|*.AppImage|*.deb|*.rpm|*.pkg.tar.zst|*-setup.exe|*-quick-uninstall.ps1)
                asset_name="${name// /.}"
                cp "$file" "release-assets/$asset_name"
                ;;
            esac
          done
          test -n "$(find release-assets -type f -print -quit)"
          find release-assets -type f -print | sort

      - name: Publish release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            create_args=("$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-from-tag)
            if [[ "$version" == *-* ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber

      - name: Add the bundled WGSExtract CLI release notes
        run: |
          cli_tag="$(cat examples/WGSExtract/scripts/wgsextract-release-tag.txt)"
          heading="## WGSExtract CLI $cli_tag"
          notes="$(gh release view "$GITHUB_REF_NAME" --json body -q .body)"
          if grep -qxF "$heading" <<<"$notes"; then
            echo "Release notes already include $heading."
            exit 0
          fi
          # Skip without writing the heading, so a re-run can still add the notes.
          if ! raw="$(gh release view "$cli_tag" -R WGSExtract/wgsextract-cli --json body -q .body)" ||
            [ -z "${raw//[[:space:]]/}" ]; then
            echo "::warning::No release notes found for WGSExtract CLI $cli_tag; skipping."
            exit 0
          fi
          # Drop the CLI notes' own "# title" line; the heading above replaces it.
          # Qualify bare "#123" references, which would otherwise link to this repository.
          cli_notes="$(sed -e '1{/^# /d;}' <<<"$raw" | sed -e '/./,$!d' |
            sed -E 's@(^|[^[:alnum:]_/&#-])#([0-9]+)@\1WGSExtract/wgsextract-cli#\2@g')"
          printf '%s\n\n%s\n\n%s\n\nFull CLI release: https://github.com/WGSExtract/wgsextract-cli/releases/tag/%s\n' \
            "$notes" "$heading" "$cli_notes" "$cli_tag" > release-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
