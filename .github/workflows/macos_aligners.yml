name: macOS Aligners

# Builds the optional Apple Silicon rebuilds of BWA (wgse-bwa) and BWA-MEM2
# (wgse-bwa-mem2), each with an experimental --metal flag, from native/ on every change
# to them, and publishes them to a prerelease when asked:
# Actions > macOS Aligners > Run workflow, with a new tag such as macos-aligners-1.
# The wgsextract CLI does not use these builds yet.

on:
  pull_request:
    branches: [ main ]
    paths:
      - native/**
      - .github/workflows/macos_aligners.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: New release tag to publish the packages under (empty builds only).
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test (development build)
        run: |
          cmake -S native -B out/build-test -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_BASE_DIR="$PWD/out/deps"
          cmake --build out/build-test -j "$(sysctl -n hw.ncpu)"
          ctest --test-dir out/build-test --output-on-failure

      - name: Build the release packages
        run: |
          cmake -S native -B out/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DFETCHCONTENT_BASE_DIR="$PWD/out/deps"
          cmake --build out/build -j "$(sysctl -n hw.ncpu)"
          cmake --install out/build --prefix out/prefix
          mkdir -p out/packages
          for tool in wgse-bwa wgse-bwa-mem2; do
            # Each package has its own version: "wgse-bwa 0.4.0; BWA 0.7.19".
            version=$("out/prefix/bin/$tool" --version | sed -n 's/^[^ ]* \([^;]*\);.*/\1/p')
            test -n "$version"
            otool -L "out/prefix/bin/$tool"
            if otool -L "out/prefix/bin/$tool" | tail -n +2 | grep -Ev '^\s+(/usr/lib/|/System/Library/)'; then
              echo "$tool links a non-system library" >&2
              exit 1
            fi
            native/tests/smoke.sh "$PWD/out/prefix/bin/$tool" "$PWD/out/smoke-$tool" metal
            package="$tool-$version-macos-arm64"
            mkdir -p "out/stage/$package/bin" "out/stage/$package/share/licenses"
            cp "out/prefix/bin/$tool" "out/stage/$package/bin/"
            cp -R "out/prefix/share/licenses/$tool" "out/stage/$package/share/licenses/"
            tar -C out/stage -czf "out/packages/$package.tar.gz" "$package"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-aligners
          path: out/packages/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-aligners
          path: macos-aligners
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          case "$TAG" in macos-aligners-*) ;; *) echo "Tag must start with macos-aligners-" >&2; exit 1 ;; esac
          {
            echo "Optional Apple Silicon (macOS 13+, arm64) rebuilds of BWA 0.7.19 and BWA-MEM2 2.3. Not used by the wgsextract CLI yet."
            echo "Both align on the CPU by default. Their EXPERIMENTAL --metal flags offload seeding (wgse-bwa) or seed extension (wgse-bwa-mem2) to the GPU."
            echo "Built from native/ at ${GITHUB_SHA} by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo "See native/README.md for usage, benchmarks and licences."
            echo
            echo "| Package | SHA-256 |"
            echo "| --- | --- |"
            for f in macos-aligners/*.tar.gz; do echo "| $(basename "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"; done
          } > notes.md
          gh release create "$TAG" macos-aligners/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "macOS aligners $TAG" \
            --notes-file notes.md --prerelease --latest=false
