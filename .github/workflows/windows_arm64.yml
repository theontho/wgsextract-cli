name: Windows ARM64 qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - packaging/windows-arm64/**
      - scripts/audit_windows_arm64.ps1
      - src/wgsextract_cli/core/windows_arm64.py
      - tests/test_windows_arm64.py
      - .github/workflows/windows_arm64.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.17"
          architecture: arm64
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install -e . pytest
          if ($LASTEXITCODE) { throw "Native test dependency installation failed" }
      - name: Fail-fast and PE validation tests
        shell: pwsh
        run: |
          python -m pytest tests/test_windows_arm64.py --basetemp=out/pytest-arm64 --junitxml=out/windows-arm64-tests.xml
          if ($LASTEXITCODE) { throw "ARM64 qualification tests failed" }
      - name: Set up native Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          run-install: false
      - name: Package native Python
        shell: pwsh
        run: |
          pixi exec --spec rattler-build==0.77.0 rattler-build build `
            --recipe-dir packaging/windows-arm64/recipes --target-platform win-arm64 `
            --output-dir out/conda
          if ($LASTEXITCODE) { throw "ARM64 Python recipe failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-arm64-qualification
          path: out/
          if-no-files-found: error
