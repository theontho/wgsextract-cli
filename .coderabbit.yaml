# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
tone_instructions: |
  Be concise and direct. Focus on correctness, security, and maintainability.
  Skip nits about style/formatting (handled by ruff).

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!**/.venv/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/__pycache__/**"
    - "!**/*.egg-info/**"
    - "!**/site/**"
    - "!**/out/**"
    - "!**/tmp/**"
    - "!**/scratch/**"
    - "!**/node_modules/**"
    - "!**/target/**"
    - "!pixi.lock"
    - "!**/*.lock"
  path_instructions:
    - path: "src/**/*.py"
      instructions: |
        Library/CLI source. Prefer explicit type annotations. Use pathlib over os.path.
        Redact secrets (keys, tokens, credentials) when displaying configuration.
    - path: "tests/**/*.py"
      instructions: |
        pytest. Verify both happy and error paths. Avoid silent assertions.
    - path: "scripts/**"
      instructions: |
        Verify both interactive and non-interactive behavior.
    - path: "gui/app/web/packagers/tauri/**/*.rs"
      instructions: |
        Tauri desktop shell. It hosts the window, menus, native pickers, and updater only;
        bundle behavior belongs in the TypeScript server. Prefer explicit error handling over unwrap/expect
        outside startup paths.
    - path: "gui/scripts/**"
      instructions: |
        Verify both interactive and non-interactive behavior.
    - path: "gui/app/**/*.{ts,mjs,js}"
      instructions: |
        TypeScript compiled with tsc to vanilla ES modules (no bundler/framework). Keep dependencies minimal.
        web/src/server is a small Node HTTP server; web/src/client is browser-side.
        Shared code in gui/app/shared must run in both Node and the browser — no Node-only
        APIs (fs, path, process) outside web/src/server. Behavior must hold on Windows, macOS, and Linux.
    - path: "gui/app/**/*.{html,css}"
      instructions: |
        Plain HTML/CSS, no framework. Watch for accessibility: every interactive control
        needs a label/aria-label; semantic elements over div soup.
    - path: "gui/app/tests/**"
      instructions: |
        Verify both happy-path and error responses. Keep tests runnable via `node --test` and listed in gui/app/scripts/run-node-tests.mjs.
    - path: "**/*.md"
      instructions: |
        Documentation. Skip prose nits unless content is misleading or incorrect.

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
