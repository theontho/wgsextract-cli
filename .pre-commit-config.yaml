repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Vendor headers are copied verbatim, trailing spaces included.
        exclude: ^src/wgsextract_cli/assets/microarray/raw_file_templates/head/|^packaging/(windows/recipes|arm64)/.*\.patch$
      - id: end-of-file-fixer
        # Upstream patch context must retain its exact whitespace and line endings.
        exclude: ^packaging/(windows/recipes|arm64)/.*\.patch$
      - id: check-yaml
      - id: check-added-large-files
        # Shipped coordinate data; the CHM13 v1 loader enforces its 7 MiB cap.
        exclude: |
          (?x)^src/wgsextract_cli/assets/microarray/(
            raw_file_templates/body/|
            chm13/v1/chm13-sites-v1-[0-9a-f]{16}\.bin\.gz$
          )
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      # ruff and mypy run from the Pixi dev environment so hooks, CI, and
      # `pixi run lint` all use the same tool versions.
      - id: ruff
        name: ruff (via pixi)
        entry: pixi run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format (via pixi)
        entry: pixi run ruff format
        language: system
        types_or: [python, pyi]
      - id: actionlint
        name: actionlint
        entry: python scripts/run_actionlint.py
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
      - id: validate-github-actions
        name: validate GitHub Actions versions
        entry: python scripts/validate_github_actions.py
        language: python
        pass_filenames: false
        files: ^(\.github/workflows/.*\.ya?ml|scripts/validate_github_actions\.py)$
      - id: validate-site-sources
        name: validate site sources
        entry: python scripts/validate_site_sources.py
        language: python
        additional_dependencies: [tomli]
        pass_filenames: false
        files: ^(site_src/.*\.(md|toml)|scripts/(build_site|validate_site_sources)\.py)$
      - id: mypy
        name: mypy (via pixi)
        entry: pixi run mypy
        language: system
        types: [python]
        pass_filenames: false
        files: ^src/wgsextract_cli/.*\.py$
