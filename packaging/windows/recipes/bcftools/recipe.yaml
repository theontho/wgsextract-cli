context:
  version: "1.24"

package:
  name: bcftools
  version: ${{ version }}

source:
  url: https://github.com/samtools/bcftools/releases/download/${{ version }}/bcftools-${{ version }}.tar.bz2
  sha256: 8caddc22610ee2851666047c859bb91da0c1e32d0c2ec553db6f153ad130e46f
  patches:
    - patches/0001-bounded-cram-stop-copy.patch
    - patches/0002-vector-bam-sequence-packing.patch
    - patches/0003-reuse-cram-buffers.patch
    - patches/0004-stack-small-introsorts.patch

build:
  number: 1
  string: wgse_${{ build_number }}
  script:
    # MSYS2 UCRT64 builds it (see ../env.sh); MSYS2_ROOT says where it is.
    env:
      MSYS2_ROOT: ${{ env.get("MSYS2_ROOT", default="C:\\msys64") }}
    content:
      - '"%MSYS2_ROOT%\usr\bin\bash.exe" "%RECIPE_DIR%\build.sh"'

tests:
  - script:
      - bcftools --version

about:
  homepage: https://www.htslib.org
  license: MIT
  license_file: LICENSE
  summary: bcftools, built natively for Windows by WGS Extract (static, with its bundled htslib).
