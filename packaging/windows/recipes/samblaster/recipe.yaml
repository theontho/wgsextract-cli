context:
  version: "0.1.26"

package:
  name: samblaster
  version: ${{ version }}

source:
  url: https://github.com/GregoryFaust/samblaster/archive/refs/tags/v.${{ version }}.tar.gz
  sha256: 6b42a53d64a3ed340852028546693a24c860f236fd70e90c2b24fde9dcc4fd63

build:
  number: 0
  string: wgse_${{ build_number }}
  script:
    # MSYS2 UCRT64 builds it (see ../env.sh); MSYS2_ROOT says where it is.
    env:
      MSYS2_ROOT: ${{ env.get("MSYS2_ROOT", default="C:\\msys64") }}
    content:
      - '"%MSYS2_ROOT%\usr\bin\bash.exe" "%RECIPE_DIR%\build.sh"'

tests:
  - script:
      - samblaster --version

about:
  homepage: https://github.com/GregoryFaust/samblaster
  license: MIT
  license_file: LICENSE.txt
  summary: samblaster duplicate marking, built natively for Windows by WGS Extract.
