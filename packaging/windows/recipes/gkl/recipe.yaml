context:
  version: "0.8.11"

package:
  name: gkl
  version: ${{ version }}

source:
  url: https://github.com/IntelLabs/GKL/archive/refs/tags/${{ version }}.tar.gz
  sha256: 23f1aa7de874e79aedc35901397545e9e406266dfb1584f21300e440806a8950
  patches:
    - patches/0001-windows-avx-native.patch

build:
  number: 1
  string: wgse_${{ build_number }}
  script:
    env:
      MSYS2_ROOT: ${{ env.get("MSYS2_ROOT", default="C:\\msys64") }}
    content:
      - '"%MSYS2_ROOT%\usr\bin\bash.exe" "%RECIPE_DIR%\build.sh"'

requirements:
  build:
    - openjdk 17.*

tests:
  - script:
      - python -c "import ctypes,os; from pathlib import Path; p=Path(os.environ['CONDA_PREFIX'])/'Library/bin'; [ctypes.WinDLL(str(p/n)) for n in ('gkl_utils.dll','gkl_pairhmm.dll','gkl_pairhmm_omp.dll','gkl_smithwaterman.dll')]"
    requirements:
      run:
        - python 3.10.*

about:
  homepage: https://github.com/IntelLabs/GKL
  license: MIT AND BSD-3-Clause
  license_file: LICENSE
  summary: GKL utils, serial/OpenMP AVX PairHMM and AVX2 Smith-Waterman JNI kernels, statically linked for native Windows.
