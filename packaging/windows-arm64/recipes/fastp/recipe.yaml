package:
  name: fastp
  version: "1.4.0"

source:
  - url: https://github.com/OpenGene/fastp/archive/refs/tags/v1.4.0.tar.gz
    sha256: 28c0537e9d1f32f5a5c404562e6a282bf373b034a4c3a3610d9aa31d6429b550
    patches:
      - ../../../windows/recipes/fastp/patches/0001-json-escape-command.patch
  - url: https://github.com/intel/isa-l/archive/refs/tags/v2.32.1.tar.gz
    sha256: d9f7179ab0e14a3db9b610fac22793854a1435e8423ec9ce07f4cbedc5f92f5e
    target_directory: isa-l

build:
  number: 0
  string: wgse_arm64_${{ build_number }}
  script:
    content:
      - 'pwsh.exe -NoProfile -ExecutionPolicy Bypass -File "%RECIPE_DIR%\build.ps1"'

tests:
  - script:
      - fastp --version

about:
  homepage: https://github.com/OpenGene/fastp
  license: MIT
  license_file: LICENSE
  summary: Native Windows ARM64 fastp Highway NEON qualification.
