package:
  name: haplogrep3
  version: "3.2.2"

source:
  - url: https://github.com/genepi/haplogrep3/releases/download/v3.2.2/haplogrep3-3.2.2-linux.zip
    sha256: c64a0a3c8cc74a96bbb41b692f904ab2c204b00bc1955dcee879ee4207cdc511
    target_directory: haplogrep3
  # The default tree, only to qualify classification; users download trees.
  - url: https://github.com/genepi/phylotree-fu-rcrs/releases/download/1.3/phylotree-fu-rcrs-1.3.zip
    sha256: ffb1d30c57b2d72d4451785f6a1c7c9ecce273971d2fafaa01f0ca94c566ced1
    target_directory: tree
  - url: https://aka.ms/download-jdk/microsoft-jdk-17.0.21.0.2-windows-aarch64.zip
    sha256: 2c0e7679022f1666da64b586f9941e86481c6f369212e918be3e505581085336
    target_directory: sdk

build:
  number: 0
  string: wgse_arm64_${{ build_number }}
  script:
    content:
      - 'pwsh.exe -NoProfile -ExecutionPolicy Bypass -File "%RECIPE_DIR%\build.ps1"'

requirements:
  run:
    - openjdk 17.*

about:
  homepage: https://github.com/genepi/haplogrep3
  license: MIT
  license_file: haplogrep3/LICENSE
  summary: Pure-Java Haplogrep 3 qualified with native ARM64 Microsoft Java 17.
