  - url: https://github.com/python/cpython-source-deps/archive/ef547e549b49a2822214ef7880c0ca212b32929e.tar.gz
    sha256: e8d069c4d94cca67809f2d38c299ecc596f93b00061db197c0562cdd042a3418
    target_directory: externals/sqlite-3.50.4.0
  - url: https://github.com/python/cpython-source-deps/archive/c6bc0c612605622aaef101a33a751f9de2ecc193.tar.gz
    sha256: 115433c946ee069e857fd04cf41b38a4a74ed45d868a3b2e08ccd4a1f04f39d0
