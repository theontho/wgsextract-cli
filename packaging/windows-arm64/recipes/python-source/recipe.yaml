  - url: https://github.com/python/cpython-source-deps/archive/4dc98e1909830e2bdc2a9cc2236e3c5d5037335b.tar.gz
    sha256: 1fe30e919eb560f495de9ee4bd7ba5216ce13f454affb4ccc32e15efa3878f5e
    target_directory: externals/zlib-1.3.1
  - url: https://github.com/python/cpython-bin-deps/archive/94cb9a1c7feb608adf2b9f8fe2dbd6925ffbf90d.tar.gz
    sha256: a285552414f66e59f3b664840a0ccda1ebc9082dd2b304eaa59ab9d47f734fec
    target_directory: externals/libffi-3.4.4
  - url: https://github.com/python/cpython-bin-deps/archive/ddb46a415b4995440723183e644f8d2c346567a2.tar.gz
    sha256: b8edfcbf494bb5b9d797ce3871a2c954d92d15a9a5a54b2eeb24475e8b4effc6
    target_directory: externals/openssl-bin-3.5.9

build:
  number: 0
  string: wgse_arm64_${{ build_number }}
  script:
    content:
      - 'pwsh.exe -NoProfile -ExecutionPolicy Bypass -File "%RECIPE_DIR%\build.ps1"'

tests:
  - script:
      - python --version
      - python -c "import ssl, sqlite3, bz2, lzma, ctypes; assert ssl.OPENSSL_VERSION.startswith('OpenSSL 3.5.9')"
      - python -m pip --version

about:
  homepage: https://www.python.org/
  license: Python-2.0
  license_file:
    - LICENSE
    - externals/bzip2-1.0.8/LICENSE
    - externals/mpdecimal-4.0.0/COPYRIGHT.txt
    - externals/xz-5.2.5/COPYING
    - externals/xz-5.2.5/COPYING.LGPLv2.1
    - externals/zlib-1.3.1/LICENSE
    - externals/libffi-3.4.4/LICENSE
    - externals/openssl-bin-3.5.9/arm64/LICENSE.txt
  summary: Source-built CPython 3.13.18 native Windows ARM64 qualification.
