package:
  name: python
  version: "3.13.18"

source:
  - url: https://www.python.org/ftp/python/3.13.18/Python-3.13.18.tar.xz
    sha256: abb0102e6d4ae027509bcb82327d9dd85515b44a3ba8ad538cfc5e9847029f68
  - url: https://github.com/python/cpython-source-deps/archive/05301997b2f9590f49c672cf3dfd3d3dfa7ad521.tar.gz
