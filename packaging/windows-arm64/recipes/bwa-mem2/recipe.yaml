    target_directory: index64
  - url: https://raw.githubusercontent.com/theontho/wgsextract-cli/${{ index_fix_commit }}/packaging/windows/tests/mem2_io.cpp
    sha256: 8164b8b8d666398092077191b01fb6aa5c0faa3f304c11aae0f7cf6b7b7e34a6
    target_directory: index64

build:
