context:
  version: "1.24"

package:
  name: bcftools
  version: ${{ version }}

source:
  - url: https://github.com/samtools/bcftools/releases/download/${{ version }}/bcftools-${{ version }}.tar.bz2
    sha256: 8caddc22610ee2851666047c859bb91da0c1e32d0c2ec553db6f153ad130e46f
    patches:
      - ../../../windows/recipes/bcftools/patches/0001-bounded-cram-stop-copy.patch
      - ../../../windows/recipes/bcftools/patches/0002-vector-bam-sequence-packing.patch
      - ../../../windows/recipes/bcftools/patches/0003-reuse-cram-buffers.patch
      - ../../../windows/recipes/bcftools/patches/0004-bulk-copy-single-sample.patch
  - url: https://github.com/samtools/bcftools/releases/download/${{ version }}/bcftools-${{ version }}.tar.bz2
    sha256: 8caddc22610ee2851666047c859bb91da0c1e32d0c2ec553db6f153ad130e46f
    target_directory: original-source

build:
  number: 1
  string: wgse_arm64_${{ build_number }}
  script:
    content:
      - 'pwsh.exe -NoProfile -ExecutionPolicy Bypass -File "%RECIPE_DIR%\build.ps1"'

tests:
  - script:
      - bcftools --version

about:
  homepage: https://www.htslib.org
  license: MIT
  license_file: LICENSE
  summary: Native Windows ARM64 bcftools qualification.
