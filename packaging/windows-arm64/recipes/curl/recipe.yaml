package:
  name: curl
  version: "8.21.0"

source:
  url: https://curl.se/download/curl-8.21.0.tar.xz
  sha256: aa1b66a70eace83dc624508745646c08ae561de512ab403adffb93ac87fc72e6

build:
  number: 0
  string: wgse_arm64_${{ build_number }}
  script:
    content:
      - 'pwsh.exe -NoProfile -ExecutionPolicy Bypass -File "%RECIPE_DIR%\build.ps1"'

tests:
  - script:
      - curl --version

about:
  homepage: https://curl.se/
  license: curl
  license_file: COPYING
  summary: Native ARM64 curl with Windows Schannel and static compression.
