[workspace]
name = "wgsextract-cli"
version = "0.6.1"
description = "A modern, standalone Command-Line Interface for WGS Extract."
authors = ["WGS Extract Contributors"]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.13.*"

[target.unix.dependencies]
curl = ">=8.21,<9"
gzip = ">=1.14,<2"
tar = ">=1.35,<2"

[target.win-64.dependencies]
curl = ">=8.21,<9"

# Python's UTF-8 mode (the default from Python 3.15): files and pipes default
# to UTF-8, not the Windows ANSI code page, as on macOS and Linux.
[target.win-64.activation.env]
PYTHONUTF8 = "1"

# GATK4's Bioconda package requires Python 3.10, so it gets its own environment;
# the CLI runs `gatk` through it automatically. GATK 4.6 is built for Java 17.
[feature.gatk.dependencies]
python = "3.10.*"
openjdk = "17.*"
gatk4 = ">=4.6.2.0,<5"

# PharmCAT's pipeline is a release download the user extracts (see
# `vcf pharmcat`); it needs Python with these packages, Java 17 and
# bcftools/bgzip 1.18. No Windows bcftools build, so macOS and Linux.
[feature.pharmcat]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[feature.pharmcat.dependencies]
python = "3.12.*"
pandas = ">=2.3.3"
colorama = ">=0.4.6"
packaging = ">=24.1"
openjdk = "17.*"
bcftools = ">=1.18"
htslib = ">=1.18"

[feature.bio-tools.pypi-dependencies]
# Bioconda's yleaf 3.2.1 artifact omits yleaf/data/* marker tables, so install
# upstream's packaged source for a runnable default Yleaf environment. A source
# archive, not a git checkout: users mustn't need git (a new Windows PC has
# none). Pin the archive digest explicitly as well as in the lockfile.
# Pixi does not generate hashes for direct URLs: retain the Yleaf package's
# explicit sha256 field in pixi.lock when refreshing it (guarded by tests).
# Upstream master after v4.1.6 plus the fix for VCF input on Windows
# (genid/Yleaf#60); go back to an upstream tag once a release has it.
yleaf = { url = "https://github.com/theontho/Yleaf/archive/8890b3abc20616307a172a0185586d9e1fd4d545.tar.gz#sha256=3e3770ef3379ddbeedabb1cb0a11280a1485c4da12995802b52956f14e247379" }

[feature.bio-tools.target.unix.dependencies]
samtools = ">=1.24,<2"
bcftools = ">=1.24,<2"
htslib = ">=1.24,<2"
bwa = ">=0.7.19,<0.8"
# bwa-mem2 aligns short reads in about 3/4 of bwa's time, with the same output.
bwa-mem2 = ">=2.3,<3"
minimap2 = ">=2.31,<3"
fastp = ">=1.1,<2"
fastqc = ">=0.13,<0.14"
haplogrep = ">=2.4,<3"
delly = ">=2.7,<3"
samblaster = ">=0.1.26,<0.2"
# Reads GERP bigWig scores for `vcf gerp`; Bioconda builds Linux and macOS.
pybigwig = ">=0.3.24,<0.4"

[feature.bio-tools.target.linux-64.dependencies]
wget = ">=1.25,<2"
# Only Linux uses sambamba (macOS sorts with samtools); its osx-arm64 build
# segfaults even on --version.
sambamba = ">=1.0.1,<2"

[feature.bio-tools.target.win-64.dependencies]
fastqc = ">=0.13,<0.14"
haplogrep = ">=2.4,<3"
# Bioconda has no Windows builds: these are WGS Extract's own static MinGW-w64
# builds (packaging/windows), from a Windows Tools release. Update them with
# `python packaging/windows/pin.py <tag>`, then `pixi lock`.
# windows-tools-begin
bcftools = { url = "https://github.com/theontho/wgsextract-cli/releases/download/windows-tools-3/bcftools-1.24-wgse_1.conda", sha256 = "3069be33a4653211ae12ea109d103fa2eee8fff589718a21db0de59ba4272fc4" }
bwa = { url = "https://github.com/theontho/wgsextract-cli/releases/download/windows-tools-4/bwa-0.7.19-wgse_2.conda", sha256 = "2726f14fa5f229629bce01e3c6c600c8d5daedf8a8c4d26aeeb298c33cd117fb" }
bwa-mem2 = { url = "https://github.com/theontho/wgsextract-cli/releases/download/windows-tools-3/bwa-mem2-2.3-wgse_1.conda", sha256 = "ed33b6af264ae0ea56dd628f501a5282e88347752a42630d030f76dbc30e9890" }
fastp = { url = "https://github.com/theontho/wgsextract-cli/releases/download/windows-tools-3/fastp-1.4.0-wgse_1.conda", sha256 = "42849b9e13cdc7dc346c6f6268836436ad500e576a9b316804742a560df797da" }
htslib = { url = "https://github.com/theontho/wgsextract-cli/releases/download/windows-tools-3/htslib-1.24-wgse_1.conda", sha256 = "20a8515d9d1e5454deec9cd957a3d11cc40c18e899e59428714e56c2071804ca" }
minimap2 = { url = "https://github.com/theontho/wgsextract-cli/releases/download/windows-tools-3/minimap2-2.31-wgse_1.conda", sha256 = "78e5650ade8221f59f5ab397f2cd640bbd6d4f8b02559feda22299b963a11fb2" }
samblaster = { url = "https://github.com/theontho/wgsextract-cli/releases/download/windows-tools-3/samblaster-0.1.26-wgse_1.conda", sha256 = "4adecc079154101e1e8aefe9fe22cdb0511d05090705c3474db5232d329c222c" }
samtools = { url = "https://github.com/theontho/wgsextract-cli/releases/download/windows-tools-3/samtools-1.24-wgse_2.conda", sha256 = "13680c7772f8abe27ae241ff67b17479020298216f828c9d9d36964c3fecf0b3" }
# windows-tools-end

# FreeBayes' only osx-arm64 build pins htslib 1.21, which conflicts with the
# htslib 1.24 that Delly 2 needs, so it gets its own environment; the CLI runs
# it there automatically. Fold it back into bio-tools once that is rebuilt.
[feature.freebayes.target.unix.dependencies]
freebayes = ">=1.3.10,<2"

# HLA typing with T1K (`typing hla`) and repeat expansions with ExpansionHunter
# (`typing str`). T1K's package pins samtools 0.1 and ExpansionHunter's (on macOS)
# htslib 1.22, so each gets its own environment; the CLI runs them there.
[feature.t1k.target.unix.dependencies]
t1k = ">=1.0.10,<2"

[feature.expansionhunter.target.unix.dependencies]
expansionhunter = ">=5.0.0,<6"

[feature.pacbio.dependencies]
python = "3.13.*"

[feature.pacbio.pypi-dependencies]
wgsextract-cli = { path = ".", editable = true }

[feature.pacbio.target.linux-64.dependencies]
pbmm2 = ">=26.2.99,<27"
pbsv = ">=2.11,<3"
sniffles = ">=2.8.1,<3"

[feature.pacbio.target.osx-arm64.dependencies]
sniffles = ">=2.8.1,<3"

[feature.pacbio.target.osx-64.dependencies]
# No current pbmm2 for Intel macOS (1.7.0 needs zlib <1.3); use minimap2 map-hifi.
sniffles = ">=2.8.1,<3"

[feature.vep]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[feature.vep.target.unix.dependencies]
ensembl-vep = ">=116.3,<117"

# conda-forge's osx-arm64 libdb ships x86_64 dylibs (conda-forge/libdb-feedstock#17),
# so DB_File's db_create is unresolved and loading it segfaults. Binding symbols
# at load time makes DB_File fail cleanly instead, and BioPerl's AnyDBM_File
# falls back to NDBM_File; VEP reads FASTA through Bio::DB::HTS::Faidx anyway.
[feature.vep.target.osx-arm64.activation.env]
PERL_DL_NONLAZY = "1"

[feature.pysam.target.unix.pypi-dependencies]
# pysam has no native Windows build.
pysam = ">=0.24.1,<0.25"

# Cyrius calls CYP2D6 star alleles from a WGS BAM/CRAM (`typing cyp2d6`). Its
# PolyForm Strict license allows noncommercial use only, so it's an opt-in
# environment (`pixi install -e cyrius`) that the CLI runs automatically.
[feature.cyrius]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[feature.cyrius.dependencies]
python = "3.12.*"
numpy = ">=2"
scipy = ">=1.14"
statsmodels = ">=0.14"

[feature.cyrius.pypi-dependencies]
# Brings pysam's PyPI wheel (a conda pysam would be installed twice).
cyrius = "==1.1.1"

# Developer tooling (tests, lint, type checking, packaging, site/CI checks).
# Kept out of the default environment that end-user installers set up; tasks
# defined here run in the `dev` environment automatically.
[feature.dev.dependencies]
pytest = ">=9.1.1,<10"
ruff = ">=0.17.1,<0.18"
mypy = ">=2.3.1,<3"
pre-commit = ">=4.6.2,<5"
uv = ">=0.13.1,<0.14"
nodejs = ">=24"
actionlint = ">=1.7.12,<2"

[feature.dev.tasks]
pytest = "pytest"
ruff = "ruff"
mypy = "mypy"
pre-commit = "pre-commit"
test = "pytest --ignore=tests/test_e2e_fast_chrM.py --ignore=tests/test_e2e_full_genome.py --ignore=tests/test_microarray_real_data.py"
test-e2e = "pytest tests/test_e2e_fast_chrM.py tests/test_e2e_full_genome.py tests/test_microarray_real_data.py"
test-e2e-fake = "pytest --fake-data tests/test_e2e_fast_chrM.py tests/test_e2e_full_genome.py"
test-remote = "pytest -m remote tests/test_remote_resources.py tests/test_remote_downloads.py tests/test_remote_benchmark.py"
smoke-test = "pytest tests/test_smoke.py tests/test_smoke_real_basics.py tests/test_smoke_real_vcf.py tests/test_smoke_real_vcf_ann.py tests/test_smoke_real_expert.py tests/test_smoke_real_ref.py"
smoke-test-full = "pytest tests/test_smoke.py tests/test_smoke_real_basics.py tests/test_smoke_real_vcf.py tests/test_smoke_real_vcf_ann.py tests/test_smoke_real_expert.py tests/test_smoke_real_ref.py tests/test_smoke_real_full.py tests/test_smoke_real_pet.py"
actionlint = "actionlint"
validate-actions = "python scripts/validate_github_actions.py"
lint = "ruff check . && python scripts/validate_site_sources.py && actionlint && python scripts/validate_github_actions.py"
format = "ruff format ."
typecheck = "mypy src/wgsextract_cli"
package-smoke = "python scripts/package_smoke.py"
jscpd = "npx --yes jscpd@5.4.2 src/wgsextract_cli --reporters console,json --output out/jscpd --min-lines 5 --min-tokens 50 --ignore '**/__pycache__/**' --ignore '**/.mypy_cache/**'"
site-build = "python scripts/build_site.py"
stats = "python scripts/project_stats.py"
stats-report = "python scripts/project_stats.py out/project_stats.txt"
benchmark-dataset = { cmd = "python scripts/build_benchmark_dataset.py", description = "Rebuild the release-backed hg19 mini-genome benchmark dataset archive." }

[feature.dev.target.osx-arm64.pypi-dependencies]
vncdotool = ">=1.2, <2"

[environments]
default = { features = ["bio-tools", "pysam"], solve-group = "default" }
dev = { features = ["bio-tools", "pysam", "dev"], solve-group = "default" }
gatk = { features = ["gatk"], no-default-feature = true }
freebayes = { features = ["freebayes"], no-default-feature = true }
t1k = { features = ["t1k"], no-default-feature = true }
expansionhunter = { features = ["expansionhunter"], no-default-feature = true }
pacbio = { features = ["bio-tools", "pacbio"], no-default-feature = true, solve-group = "pacbio-unix" }
vep = { features = ["vep"], no-default-feature = true }
pharmcat = { features = ["pharmcat"], no-default-feature = true }
cyrius = { features = ["cyrius"], no-default-feature = true }

[pypi-dependencies]
# pysam is platform-specific (no native Windows build); see feature.pysam.
wgsextract-cli = { path = ".", editable = true }

[tasks]
deps-check = "wgsextract deps check"
clean = { cmd = "python scripts/clean_outputs.py", description = "Remove gitignored scratch dirs (out/, tmp/)." }
gc = { cmd = "python scripts/installlab/lab.py gc", description = "Remove expired install-lab runs, images and leftovers (--dry-run to preview)." }
