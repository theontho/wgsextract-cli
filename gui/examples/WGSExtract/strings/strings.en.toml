"controls.settings.post-v063.logs.label" = "Persistent run log directory"
"controls.settings.post-v063.logs.tooltip" = "Opt-in directory for unique DEBUG logs and companion provenance JSON. Blank disables persistent logs; logs may contain local file paths."
"controls.settings.post-v063.atomic.label" = "Publish main outputs atomically"
