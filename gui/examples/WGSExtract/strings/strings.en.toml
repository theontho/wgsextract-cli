"options.vcf.v066.auto.title" = "Automatic (detect from reads)"
"options.vcf.v066.config-default.title" = "Use config default"
"controls.vcf.v066.deepvariant-model.label" = "DeepVariant model"
"controls.vcf.v066.deepvariant-model.tooltip" = "Automatic uses ONT_R104 for detected Nanopore reads, ULTIMA for Ultima reads with flow tags, and otherwise WGS. ONT_R104 equals the CLI's --ont: R10.4.1 chemistry only, and x86-64 only (refused on Apple Silicon and ARM64). R9.4.1 is unsupported, and a missing warning does not prove support. DeepVariant does not run on native Windows."
"options.vcf.v066.deepvariant-model.ont.title" = "Oxford Nanopore R10.4.1 (ONT_R104, x86-64 only)"
"options.vcf.v066.deepvariant-model.wgs.title" = "WGS"
"options.vcf.v066.deepvariant-model.wes.title" = "WES"
"options.vcf.v066.deepvariant-model.pacbio.title" = "PacBio HiFi (PACBIO)"
"options.vcf.v066.deepvariant-model.hybrid.title" = "Hybrid PacBio + Illumina"
"options.vcf.v066.deepvariant-model.ultima.title" = "Ultima"
"controls.vcf.v066.sv-read-type.label" = "SV long-read mode"
"controls.vcf.v066.sv-read-type.tooltip" = "Automatic runs Sniffles for detected Nanopore reads and otherwise Delly, including PacBio reads. The long-read choices select Sniffles, which must already be installed. pbsv is PacBio-only and is not offered for Nanopore. Sniffles does not run on native Windows."
"options.vcf.v066.sv-read-type.ont.title" = "Oxford Nanopore (--ont)"
"options.vcf.v066.sv-read-type.long-read.title" = "Any long-read data (--long-read)"
"controls.vcf.v066.sv-tandem-repeats.label" = "Tandem-repeat BED (optional)"
"controls.vcf.v066.sv-tandem-repeats.tooltip" = "Optional BED for long-read SV callers, which improves calls in repeats. Blank sends nothing."
"sections.vcf.v066.clair3.title" = "Clair3 Small Variants (Optional)"
"sections.vcf.v066.clair3.subtitle" = "Optional Nanopore caller, qualified on Linux x86-64 only; macOS and ARM are refused. It is not installed by setup: run pixi install -e clair3 in the WGS Extract runtime. DeepVariant stays the default Nanopore caller."
"controls.vcf.v066.clair3-model.label" = "Clair3 model (optional)"
"controls.vcf.v066.clair3-model.placeholder" = "r1041_e82_400bps_sup_v500"
"controls.vcf.v066.clair3-model.tooltip" = "Model name or directory matching the reads' basecaller. Blank uses clair3_model from config.toml, then the basecaller named in the BAM/CRAM header; if neither names one, the run stops and asks for a model. HiFi, Illumina and *_with_mv models are refused."
"actions.vcf.v066.clair3.title" = "Clair3"
"actions.vcf.v066.clair3.tooltip" = "Call small variants in Nanopore reads with Clair3, using the BAM/CRAM, reference, output folder and region from the sections above."
"sections.vcf.v066.methylation.title" = "Methylation Pileup"
"sections.vcf.v066.methylation.subtitle" = "Needs MM/ML tags from a modified-base basecalling model; short-read input is refused. modkit is not installed by setup: run pixi install -e modkit in the WGS Extract runtime. Writes <input>.<context>.bedmethyl.gz with its index, and a summary in <input>.<context>.methylation.tsv."
"controls.vcf.v066.methylation-context.label" = "Methylation context"
"controls.vcf.v066.methylation-context.tooltip" = "The config default is methylation_context in config.toml, otherwise CpG. All cytosines cannot be combined with summing strands."
"options.vcf.v066.methylation-context.cpg.title" = "CpG sites only"
"options.vcf.v066.methylation-context.all.title" = "All cytosines"
"controls.vcf.v066.methylation-5hmc.label" = "5hmC reporting"
"controls.vcf.v066.methylation-5hmc.tooltip" = "The config default is methylation_5hmc in config.toml, otherwise off. 5hmC needs a Nanopore 5mCG_5hmCG model."
"options.vcf.v066.methylation-5hmc.on.title" = "Report 5hmC as well as 5mC"
"options.vcf.v066.methylation-5hmc.off.title" = "5mC only"
"controls.vcf.v066.methylation-combine.label" = "CpG strands"
"controls.vcf.v066.methylation-combine.tooltip" = "The config default is methylation_combine_strands in config.toml, otherwise on for CpG."
"options.vcf.v066.methylation-combine.on.title" = "Sum both strands of each CpG"
"options.vcf.v066.methylation-combine.off.title" = "Keep strands separate"
"actions.vcf.v066.methylation.title" = "Methylation Pileup"
"actions.vcf.v066.methylation.tooltip" = "Build a bedMethyl table and summary with modkit, using the BAM/CRAM, reference, output folder and region from the sections above."
"controls.ancestry.v066.y-str-panel.label" = "Y-STR panel"
"controls.ancestry.v066.y-str-panel.tooltip" = "Marker panel for Y-STR repeat counts. Default leaves the choice to the CLI, which uses Y-111."
"options.ancestry.v066.y-str-panel.default.title" = "Default (Y-111)"
"options.ancestry.v066.y-str-panel.y12.title" = "FamilyTreeDNA Y-12"
"options.ancestry.v066.y-str-panel.y25.title" = "FamilyTreeDNA Y-25"
"options.ancestry.v066.y-str-panel.y37.title" = "FamilyTreeDNA Y-37"
"options.ancestry.v066.y-str-panel.y67.title" = "FamilyTreeDNA Y-67"
"options.ancestry.v066.y-str-panel.y111.title" = "FamilyTreeDNA Y-111"
"options.ancestry.v066.y-str-panel.ppy23.title" = "PowerPlex Y23"
"options.ancestry.v066.y-str-panel.yfiler.title" = "Yfiler Plus"
"options.ancestry.v066.y-str-panel.all.title" = "All markers"
"actions.ancestry.v066.y-str.title" = "Y-STR Repeat Counts"
"actions.ancestry.v066.y-str.tooltip" = "Call Y-STR repeat counts from an indexed BAM or CRAM on GRCh37, GRCh38 or T2T-CHM13. Writes a table and a FamilyTreeDNA-order CSV to a ystr folder. CRAM needs the matching reference."
"controls.annotate.v066.table-sample.label" = "Variant table sample (optional)"
"controls.annotate.v066.table-sample.tooltip" = "Sample whose genotypes to use. Blank uses the first sample in the VCF."
"controls.annotate.v066.table-all-alleles.label" = "Variant table: include alleles the sample lacks"
"controls.annotate.v066.table-all-alleles.tooltip" = "Also export ALT alleles the sample does not carry, such as 0/0 calls and no-calls."
"controls.annotate.v066.table-no-sqlite.label" = "Variant table: skip the SQLite database"
"controls.annotate.v066.table-no-sqlite.tooltip" = "Write only the TSV table."
"actions.annotate.v066.vcf-table.title" = "Variant Table"
"actions.annotate.v066.vcf-table.tooltip" = "Export one row per variant with its annotations and genotype, as a TSV table and an SQLite database to query."
"sections.settings.v066.report-issue.title" = "Report a Problem"
"sections.settings.v066.report-issue.subtitle" = "Preview a redacted bug report about this installation and a recent run. Nothing is uploaded."
"controls.settings.v066.report-last-failed.label" = "Report the last failed run"
"controls.settings.v066.report-last-failed.tooltip" = "Unchecked reports on the last run, whether or not it failed."
"controls.settings.v066.report-description.label" = "What happened? (optional)"
"controls.settings.v066.report-description.tooltip" = "Your description is added to the report. Leave out names and other personal details."
"actions.settings.v066.report-issue.title" = "Preview Bug Report"
"actions.settings.v066.report-issue.tooltip" = "Print and save a report with names, paths, reads, genotypes and secrets removed, plus a link to a pre-filled GitHub issue. The browser does not open, and nothing is submitted unless you open the link and submit it yourself."
