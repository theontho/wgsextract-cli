"controls.fastq.post-v063.multiqc-force.label" = "Replace existing MultiQC report"
"controls.fastq.post-v063.multiqc-force.tooltip" = "Opt in to replacing multiqc_report.html. Otherwise choose a new output directory; existing reports are protected."
