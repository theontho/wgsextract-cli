"controls.settings.post-v063.awake.label" = "Keep awake during commands"
"controls.settings.post-v063.awake.tooltip" = "Best-effort sleep inhibition while CLI commands run. Opt in; default is off. Availability depends on the operating system."
"sections.microarray.post-v063.builds.subtitle" = "AADR exports require GRCh37 or GRCh38. For native CHM13 calling, select the CLI-supported pinned CHM13 reference; no generic liftover or extra mode flag is used. Consumer layouts are marker-only unless a matching sequence-defined indel manifest is supplied through the advanced CLI."
"actions.library.post-v063.ybrowse.title" = "Install GRCh38 yBrowse Y-SNP targets"
"actions.library.post-v063.ybrowse.tooltip" = "Explicitly download and verify the CLI's hash-pinned GRCh38 sites-only yBrowse snapshot into the reference library. Other builds are rejected. Nothing is installed unless this action is run."
"controls.microarray.post-v063.indel-format.label" = "I/D manifest output format ID"
"controls.microarray.post-v063.indel-format.tooltip" = "Optional selected consumer format ID, for example myheritage_gsa_2025. Provide its matching manifest below; this opts in to sequence-defined I/D calls. Multiple manifest bindings remain an advanced CLI option."
"controls.microarray.post-v063.indel-manifest.label" = "Matching GRCh37 Illumina I/D manifest"
"controls.microarray.post-v063.indel-manifest.tooltip" = "Optional matching sequence-defined Illumina CSV, gzip or ZIP. Both format ID and file are required to opt in. Do not substitute a marker-only layout; unsupported or ambiguous probes remain no-calls."
"controls.info-bam.post-v063.keep-fastq.label" = "Keep FASTQs extracted by realignment"
"controls.info-bam.post-v063.keep-fastq.tooltip" = "Realign only: opt in to retaining extracted FASTQs in the output directory after success. Unchecked cleans successful CLI-owned temporary FASTQs; failed alignment may retain them for recovery. Refused for Nanopore input, which would lose its MM/ML methylation tags."
