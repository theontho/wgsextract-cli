[package]
name = "gui-for-cli-webui-tauri"
version = "0.1.0"
description = "Tauri shell for the GUI for CLI Web UI"
authors = ["GUI for CLI contributors"]
edition = "2021"

[[bin]]
name = "gui-for-cli-webui-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
getrandom = { version = "0.3", features = ["std"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
bench-console = []
